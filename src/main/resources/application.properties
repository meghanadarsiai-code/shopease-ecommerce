spring.application.name=ShopEase
server.port=8080

# H2 file database (no setup needed). Data survives restarts in ./data
spring.datasource.url=jdbc:h2:file:./data/shopease;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false

# --- To use MySQL instead, add mysql-connector-j to pom.xml and use: ---
# spring.datasource.url=jdbc:mysql://localhost:3306/shopease?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=yourpassword
