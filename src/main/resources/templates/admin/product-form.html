<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container narrow">
  <h1 th:text="${product.id == null} ? 'Add Product' : 'Edit Product'"></h1>
  <form th:action="@{/admin/products/save}" th:object="${product}" method="post" class="form">
    <input type="hidden" th:field="*{id}">
    <label>Name <input type="text" th:field="*{name}">
      <span class="err" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span></label>
    <label>Description <textarea th:field="*{description}" rows="3"></textarea></label>
    <label>Price (₹) <input type="number" step="0.01" th:field="*{price}">
      <span class="err" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span></label>
    <label>Stock <input type="number" th:field="*{stock}">
      <span class="err" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span></label>
    <label>Category <input type="text" th:field="*{category}"></label>
    <label>Image URL <input type="text" th:field="*{imageUrl}"></label>
    <button class="btn" type="submit">Save</button>
    <a th:href="@{/admin/products}">Cancel</a>
  </form>
</main>
</body>
</html>
