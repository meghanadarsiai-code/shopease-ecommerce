<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
  <div th:replace="~{fragments :: flash}"></div>
  <h1>Manage Products</h1>
  <a th:href="@{/admin/products/new}" class="btn">+ Add Product</a>
  <table class="table">
    <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
    <tbody>
      <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.category}"></td>
        <td th:text="'₹' + ${p.price}"></td>
        <td th:text="${p.stock}"></td>
        <td>
          <a th:href="@{/admin/products/{id}/edit(id=${p.id})}" class="btn small">Edit</a>
          <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post" class="inline"
                onsubmit="return confirm('Delete this product?')">
            <button type="submit" class="btn small danger">Delete</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
