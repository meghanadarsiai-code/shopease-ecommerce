<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container narrow">
  <h1>Create Account</h1>
  <p class="alert error" th:if="${error}" th:text="${error}"></p>
  <form th:action="@{/register}" method="post" class="form">
    <label>Full name <input type="text" name="name" required></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Password (min 6 chars) <input type="password" name="password" minlength="6" required></label>
    <button class="btn" type="submit">Register</button>
  </form>
  <p>Already have an account? <a th:href="@{/login}">Login</a></p>
</main>
</body>
</html>
