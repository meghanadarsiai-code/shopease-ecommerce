<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
  <div th:replace="~{fragments :: flash}"></div>
  <h1>My Orders</h1>
  <p th:if="${#lists.isEmpty(orders)}">You have no orders yet.</p>
  <table class="table" th:if="${!#lists.isEmpty(orders)}">
    <thead><tr><th>Order</th><th>Date</th><th>Total</th><th>Status</th><th></th></tr></thead>
    <tbody>
      <tr th:each="o : ${orders}">
        <td th:text="'#' + ${o.id}"></td>
        <td th:text="${#temporals.format(o.createdAt, 'dd MMM yyyy HH:mm')}"></td>
        <td th:text="'₹' + ${o.total}"></td>
        <td><span class="badge" th:text="${o.status}"></span></td>
        <td><a th:href="@{/orders/{id}(id=${o.id})}">View</a></td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
