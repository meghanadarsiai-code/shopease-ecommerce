<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
  <div th:replace="~{fragments :: flash}"></div>
  <h1 th:text="'Order #' + ${order.id}"></h1>
  <p>Status: <span class="badge" th:text="${order.status}"></span> &nbsp;
     Placed: <span th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}"></span></p>
  <p>Ship to: <span th:text="${order.shippingAddress}"></span></p>
  <table class="table">
    <thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Subtotal</th></tr></thead>
    <tbody>
      <tr th:each="i : ${order.items}">
        <td th:text="${i.productName}"></td>
        <td th:text="'₹' + ${i.unitPrice}"></td>
        <td th:text="${i.quantity}"></td>
        <td th:text="'₹' + ${i.subtotal}"></td>
      </tr>
    </tbody>
    <tfoot><tr><td colspan="3" class="right"><strong>Total</strong></td>
      <td><strong th:text="'₹' + ${order.total}"></strong></td></tr></tfoot>
  </table>
  <a th:href="@{/orders}">&larr; Back to orders</a>
</main>
</body>
</html>
