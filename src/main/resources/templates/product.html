<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="container">
  <div th:replace="~{fragments :: flash}"></div>
  <div class="detail">
    <img th:src="${product.imageUrl}" th:alt="${product.name}">
    <div>
      <small class="muted" th:text="${product.category}"></small>
      <h1 th:text="${product.name}"></h1>
      <p class="price big" th:text="'₹' + ${product.price}"></p>
      <p th:text="${product.description}"></p>
      <p th:if="${product.stock > 0}" class="muted" th:text="${product.stock} + ' in stock'"></p>
      <p th:if="${product.stock == 0}" class="out">Out of stock</p>
      <form th:if="${product.stock > 0}" th:action="@{/cart/add}" method="post">
        <input type="hidden" name="productId" th:value="${product.id}">
        <label>Quantity
          <input type="number" name="quantity" value="1" min="1" th:max="${product.stock}" class="qty">
        </label>
        <button class="btn" type="submit">Add to Cart</button>
      </form>
      <p><a th:href="@{/}">&larr; Continue shopping</a></p>
    </div>
  </div>
</main>
</body>
</html>
