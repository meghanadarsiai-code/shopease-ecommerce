<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopEase</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:fragment="nav" class="navbar">
  <a class="brand" th:href="@{/}">🛒 ShopEase</a>
  <form class="search" th:action="@{/}" method="get">
    <input name="q" placeholder="Search products...">
    <button type="submit">Search</button>
  </form>
  <div class="links">
    <a th:href="@{/}">Home</a>
    <a th:href="@{/cart}">Cart</a>
    <a th:href="@{/orders}" sec:authorize="isAuthenticated()">My Orders</a>
    <a th:href="@{/admin/products}" sec:authorize="hasRole('ADMIN')">Manage Products</a>
    <a th:href="@{/admin/orders}" sec:authorize="hasRole('ADMIN')">All Orders</a>
    <a th:href="@{/login}" sec:authorize="!isAuthenticated()">Login</a>
    <a th:href="@{/register}" sec:authorize="!isAuthenticated()">Register</a>
    <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="inline">
      <button type="submit" class="link-btn">Logout (<span sec:authentication="name"></span>)</button>
    </form>
  </div>
</nav>
<div th:fragment="flash">
  <p class="alert success" th:if="${success}" th:text="${success}"></p>
  <p class="alert error" th:if="${error}" th:text="${error}"></p>
</div>
</body>
</html>
